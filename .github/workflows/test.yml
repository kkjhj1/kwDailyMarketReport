name: Python unit tests
on: [push, pull_request]
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install httpx pytest tzdata pyyaml
      - name: Compile check
        run: python -m compileall -q auto_factory market_brief travel_brief silver_care admission_brief kids_compass yolo_brief chungyak_brief portal_hub scripts
      - name: Run offline tests
        run: python -m pytest -v
      - name: Run holdout eval
        run: python -m pytest holdout_eval -v
      - name: Audit test quality
        run: python scripts/audit_test_quality.py
