name: Market Briefing 24-7 Cron & Pages Report

on:
  # 1. GitHub 웹페이지에서 언제든 버튼 한 번으로 수시/즉시 발송 가능 (Manual Trigger)
  workflow_dispatch:
    inputs:
      mode:
        description: "발송할 브리핑 종류 선택 (closing / morning / urgent / check-urgent)"
        required: true
        default: "closing"
        type: choice
        options:
          - closing
          - morning
          - urgent
          - check-urgent
      recipients:
        description: "발송 대상 Chat ID 목록 (콤마 구분, 비어있으면 기본 Secret 전체 사용)"
        required: false
        default: ""

  # 2. [오라클 클라우드 VM 단일화 완료]
  # 모든 정기 스케줄은 오라클 서버 crontab(run_cron.sh)으로 일원화되었습니다.
  # 중복 발송 및 DB 오염을 원천 차단하기 위해 GitHub Actions 자동 스케줄은 비활성화합니다.
  # schedule:
  #   - cron: "33 21 * * 0-4"
  #   - cron: "7,22,37,52 0-6 * * 1-5"
  #   - cron: "42 6 * * 1-5"
  #   - cron: "8,23,38,53 13-21 * * 1-5"



permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "market-briefing-pages"
  cancel-in-progress: false

jobs:
  briefing-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ vars.TELEGRAM_CHAT_ID || secrets.TELEGRAM_CHAT_ID }}
      REPORT_BASE_URL: ${{ secrets.REPORT_BASE_URL }}
    steps:
      - name: 1. 저장소 코드 체크아웃
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 2. Python 3.11 설정
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 3. 당일 ±3% 중복방지 DB 캐시 복원 (거래일당 1회 발송 보장)
        uses: actions/cache@v4
        with:
          path: |
            alerts.sqlite3
            quotes.sqlite3
            reports
          key: market-brief-state-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            market-brief-state-${{ runner.os }}-

      - name: 4. 상세 HTML 리포트 먼저 생성 및 GitHub Pages 배포 준비
        run: |
          mkdir -p reports
          # 1) 발송 대상 Chat ID 결정: 관리자 선택(inputs) 우선, 없을 경우 GitHub Variables -> Secrets 순서로 폴백
          TARGET_CHAT_ID="${{ vars.TELEGRAM_CHAT_ID || secrets.TELEGRAM_CHAT_ID }}"
          if [ -n "${{ github.event.inputs.recipients }}" ]; then
            TARGET_CHAT_ID="${{ github.event.inputs.recipients }}"
            echo "🎯 [관리자 선택 발송 모드] 지정된 수신자에게만 발송: $TARGET_CHAT_ID"
          else
            echo "👥 [크론/기본 동기화 발송 모드] 동기화된 수신자 대상 발송: $TARGET_CHAT_ID"
          fi

          # 2) 수동 실행(workflow_dispatch) 또는 정기 크론(schedule) 실행
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            MODE="${{ github.event.inputs.mode }}"
            if [ "$MODE" = "check-urgent" ]; then
              python telegram_bot_runner.py --check-urgent --live-naver --chat-id "$TARGET_CHAT_ID"
            else
              python telegram_bot_runner.py --send-now "$MODE" --live-naver --chat-id "$TARGET_CHAT_ID"
            fi
          else
            python telegram_bot_runner.py --auto-schedule --live-naver --chat-id "$TARGET_CHAT_ID"
          fi

      - name: 5. GitHub Pages 전용 배포 디렉터리 격리 (DB 및 시스템 파일 노출 원천 차단)
        if: always()
        run: |
          mkdir -p _site
          cp -r reports _site/
          cp index.html _site/ 2>/dev/null || true

      - name: 6. GitHub Pages 아티팩트 업로드 (정적 HTML 리포트 전용)
        if: always()
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"

      - name: 7. GitHub Pages 배포 실행 (클릭 가능한 HTTPS 리포트 링크 활성화)
        if: always()
        id: deployment
        uses: actions/deploy-pages@v4

      - name: 8. 발송 이력 및 상태 영구 보존 (Git Commit & Push)
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reports/index.html reports/latest.html reports/*.html 2>/dev/null || true
          if ! git diff --staged --quiet; then
            git commit -m "chore(auto): update briefing delivery state and reports [skip ci]"
            git pull --rebase origin main || true
            git push origin main || echo "⚠️ Git push failed or skipped (non-critical)"
          fi
