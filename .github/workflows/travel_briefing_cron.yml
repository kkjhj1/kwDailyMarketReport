name: Travel Briefing Automation

on:
  schedule:
    # 매주 목요일 12:00 KST (03:00 UTC) 주말 특가 브리핑
    - cron: '0 3 * * 4'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run preview without sending Telegram (true/false)'
        required: false
        default: 'false'
        type: boolean
      recipients:
        description: 'Specific Telegram Chat IDs (comma-separated). Leave empty for TRAVEL topic.'
        required: false
        default: ''
        type: string
      budget:
        description: 'Filter maximum 1-person total budget (KRW, optional)'
        required: false
        default: ''
        type: string

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 'travel-briefing-automation'
  cancel-in-progress: false

jobs:
  travel-brief:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 2. Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 3. Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: 4. Run Travel Briefing Runner
        env:
          TRAVEL_TELEGRAM_BOT_TOKEN: ${{ secrets.TRAVEL_TELEGRAM_BOT_TOKEN || secrets.TELEGRAM_BOT_TOKEN }}
          TRAVEL_TELEGRAM_CHAT_ID: ${{ secrets.TRAVEL_TELEGRAM_CHAT_ID || vars.TRAVEL_TELEGRAM_CHAT_ID || secrets.TELEGRAM_CHAT_ID }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
          INPUT_RECIPIENTS: ${{ inputs.recipients }}
          INPUT_BUDGET: ${{ inputs.budget }}
        run: |
          CMD="python travel_bot_runner.py"
          if [ "$INPUT_DRY_RUN" = "true" ]; then
            CMD="$CMD --dry-run"
          else
            CMD="$CMD --send-brief"
          fi
          if [ -n "$INPUT_RECIPIENTS" ]; then
            CMD="$CMD --recipients $INPUT_RECIPIENTS"
          fi
          if [ -n "$INPUT_BUDGET" ]; then
            CMD="$CMD --budget $INPUT_BUDGET"
          fi
          echo "Executing: $CMD"
          $CMD

      - name: 5. Commit and Push Updated Reports for GitHub Pages
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action [TravelBrief]"
          git add reports/travel/ reports/travel_latest.html
          if git diff --staged --quiet; then
            echo "No travel report changes to commit."
          else
            git commit -m "chore(travel-report): auto-update weekend travel briefing reports [skip ci]"
            git push origin HEAD:${{ github.ref }}
          fi
