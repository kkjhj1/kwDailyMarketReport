name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'reports/**'
      - 'index.html'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "market-briefing-pages"
  cancel-in-progress: false

jobs:
  deploy-pages:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Prepare Pages Artifact (Exclude DB/Sensitive Files)
        run: |
          mkdir -p _site
          cp -r reports _site/
          cp index.html _site/ 2>/dev/null || true
          cp reports/yolo_latest.html _site/ 2>/dev/null || true
          cp reports/travel_latest.html _site/ 2>/dev/null || true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
