name: Admission Briefing Automation (에듀브리프 입시 브리핑 자동화)

on:
  schedule:
    # 1. 매주 일요일 20:00 KST (11:00 UTC) - 학년별 주간 To-Do 브리핑 자동 발송
    - cron: '0 11 * * 0'
    # 2. 매일 08:30 KST (전날 23:30 UTC) - 공식 교육 공지 및 설명회 자동 수집
    - cron: '30 23 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: '실행 모드 선택 (weekly: 주간브리핑, collect: 공지수집, dispatch: 즉시발송)'
        required: true
        default: 'weekly'
        type: choice
        options:
          - weekly
          - collect
          - dispatch
      grade:
        description: '대상 학년 선택 (MIDDLE: 중등/예비고1, HIGH_1_2: 고1~고2, HIGH_3_N: 고3/N수, ALL: 전체)'
        required: true
        default: 'ALL'
        type: choice
        options:
          - ALL
          - MIDDLE
          - HIGH_1_2
          - HIGH_3_N
      dry_run:
        description: '시뮬레이션 모드 (실제 텔레그램 발송 없이 카드 미리보기만 실행)'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: 'admission-briefing-automation'
  cancel-in-progress: false

jobs:
  admission-brief:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 2. Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 3. Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: 4. Execute Admission Briefing Pipeline
        env:
          ADMISSION_TELEGRAM_BOT_TOKEN: ${{ secrets.ADMISSION_TELEGRAM_BOT_TOKEN || secrets.EDU_TELEGRAM_BOT_TOKEN || secrets.TELEGRAM_BOT_TOKEN }}
          ADMISSION_TELEGRAM_CHAT_ID: ${{ secrets.ADMISSION_TELEGRAM_CHAT_ID || vars.ADMISSION_TELEGRAM_CHAT_ID || secrets.TELEGRAM_CHAT_ID }}
          INPUT_MODE: ${{ inputs.mode || 'weekly' }}
          INPUT_GRADE: ${{ inputs.grade || 'ALL' }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          echo "🚀 Running Admission Briefing Automation..."
          echo "Mode: $INPUT_MODE | Grade: $INPUT_GRADE | DryRun: $INPUT_DRY_RUN"
          
          # 1. 공지 자동 수집
          if [ "$INPUT_MODE" = "collect" ]; then
            python admission_bot_runner.py --collect
          elif [ "$INPUT_DRY_RUN" = "true" ]; then
            python admission_bot_runner.py --dry-run --grade "$INPUT_GRADE"
          else
            # 2. 브리핑 정기/수동 발송
            # 발송 전 최신 공지 1회 수집
            python admission_bot_runner.py --collect
            
            if [ "$INPUT_GRADE" = "ALL" ]; then
              echo "Dispatching to all grades..."
              python admission_bot_runner.py --dispatch --grade MIDDLE
              python admission_bot_runner.py --dispatch --grade HIGH_1_2
              python admission_bot_runner.py --dispatch --grade HIGH_3_N
            else
              python admission_bot_runner.py --dispatch --grade "$INPUT_GRADE"
            fi
          fi

      - name: 5. Commit and Push Database State
        if: ${{ inputs.dry_run != true }}
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add data/admission_brief.db || true
          if git diff --staged --quiet; then
            echo "No database changes to commit."
          else
            git commit -m "chore(admission): sync subscriber & dispatch database [skip ci]"
            git push origin main || echo "Git push skipped or non-fast-forward."
          fi
